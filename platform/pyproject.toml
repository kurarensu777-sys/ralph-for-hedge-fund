[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fundplat"
version = "0.1.0"
description = "The research figure style (fundplat.quant.core.figstyle) the chart checkers and chart bank code import."
requires-python = ">=3.11"
dependencies = ["matplotlib>=3.8", "numpy>=1.26", "pandas>=2.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["fundplat*"]
